name: Build release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            artifact: Splash-windows-x64.exe
            pyinstaller-out: dist/Splash.exe
            kind: file

          - label: linux-x64
            os: ubuntu-latest
            artifact: Splash-linux-x86_64
            pyinstaller-out: dist/Splash
            kind: file

          - label: macos-arm64
            os: macos-14
            artifact: Splash-macos-arm64.dmg
            pyinstaller-out: dist/Splash.app
            kind: macapp
          # Intel Mac builds were on macos-13. GitHub's macos-13 runner pool
          # is starved as of 2026 — jobs queue for hours. v1.x ships Apple
          # Silicon only; Intel returns in v1.1 as a universal2 build off macos-14.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux Qt runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libegl1 libgl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: pyinstaller --clean --noconfirm build/splash.spec

      - name: Package artifact (file)
        if: matrix.kind == 'file'
        shell: bash
        run: |
          mkdir -p out
          cp "${{ matrix.pyinstaller-out }}" "out/${{ matrix.artifact }}"

      - name: Ad-hoc codesign + DMG (macOS)
        if: matrix.kind == 'macapp'
        shell: bash
        run: |
          mkdir -p out staging
          # Ad-hoc signature — avoids the worst "is damaged" errors on Apple
          # Silicon for self-distributed apps. Users still need to clear the
          # quarantine attribute on first launch (see README + /thank-you).
          # When an Apple Developer ID is added, swap "-" for the team identity.
          codesign --force --deep --sign - --options runtime dist/Splash.app
          codesign --verify --deep --strict dist/Splash.app

          # DMG layout: app bundle + Applications symlink for drag-to-install UX.
          cp -R dist/Splash.app staging/Splash.app
          ln -s /Applications staging/Applications

          hdiutil create \
            -volname Splash \
            -srcfolder staging \
            -ov \
            -format UDZO \
            "out/${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage docs alongside binaries
        run: |
          mkdir -p artifacts/docs
          cp USER_GUIDE.md artifacts/docs/USER_GUIDE.md
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: false

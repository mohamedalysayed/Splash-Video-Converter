[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splash-video-converter"
version = "3.0.0"
description = "A beautiful, modern cross-platform video & audio converter powered by FFmpeg."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Mohamed Aly Sayed", email = "muhammmedaly@gmail.com" }]
keywords = ["ffmpeg", "video", "converter", "mkv", "mov", "mp4", "webm", "gui", "pyside6"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = ["PySide6>=6.6"]

[project.scripts]
splash = "converter.app:main"

[project.urls]
Homepage = "https://github.com/mohamedalysayed/Splash-Video-Converter"
Issues = "https://github.com/mohamedalysayed/Splash-Video-Converter/issues"

[tool.setuptools.packages.find]
include = ["converter*"]
